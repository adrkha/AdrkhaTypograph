name: Build and Sign Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore AdrkhaTypograph.csproj -PackagesDirectory packages

    - name: Import Certificate for Signing Manifests
      run: Import-PfxCertificate -FilePath 'AdrkhaTypograph_TemporaryKey.pfx' -CertStoreLocation Cert:\CurrentUser\My
      shell: powershell

    - name: Build Project (Release)
      run: msbuild AdrkhaTypograph.csproj /p:Configuration=Release /t:Rebuild /fl

    - name: Print MSBuild Log on Failure
      if: failure()
      run: Get-Content msbuild.log -Tail 150
      shell: powershell

    - name: Upload MSBuild Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: msbuild-log
        path: msbuild.log

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Compile Inno Setup Installer
      run: iscc AdrkhaTypograph.iss

    - name: Upload Unsigned Installer
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-installer
        path: Installer/AdrkhaTypograph_v1.0.0_Setup.exe

