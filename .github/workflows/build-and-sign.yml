name: Build and Sign Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore AdrkhaTypograph.csproj -PackagesDirectory packages

    - name: Import Certificate for Signing Manifests
      run: Import-PfxCertificate -FilePath 'AdrkhaTypograph_TemporaryKey.pfx' -CertStoreLocation Cert:\CurrentUser\My
      shell: powershell

    - name: Diagnostics - Check VSTO targets and CI env
      shell: powershell
      run: |
        Write-Output "CI env var: $env:CI"
        $vsToolsPath = & vswhere -latest -property installationPath 2>$null
        Write-Output "VS Install Path: $vsToolsPath"
        $targetPath = Join-Path $vsToolsPath "MSBuild\Microsoft\VisualStudio\v18.0\OfficeTools\Microsoft.VisualStudio.Tools.Office.targets"
        Write-Output "VSTO targets exists: $(Test-Path $targetPath)"
        if (-not (Test-Path $targetPath)) {
            # Try v17.0
            $targetPath17 = Join-Path $vsToolsPath "MSBuild\Microsoft\VisualStudio\v17.0\OfficeTools\Microsoft.VisualStudio.Tools.Office.targets"
            Write-Output "VSTO targets v17.0 exists: $(Test-Path $targetPath17)"
        }
        # List OfficeTools folder if it exists
        $officeDir = Join-Path $vsToolsPath "MSBuild\Microsoft\VisualStudio"
        if (Test-Path $officeDir) {
            Get-ChildItem $officeDir -Recurse -Filter "*Office*" | Select-Object -First 20 | ForEach-Object { Write-Output $_.FullName }
        }

    - name: Build Project (Release)
      run: msbuild AdrkhaTypograph.csproj /p:Configuration=Release /p:CI=true /t:Rebuild /fl /flp:Verbosity=diagnostic

    - name: Print MSBuild Log on Failure
      if: failure()
      shell: powershell
      run: |
        if (Test-Path msbuild.log) {
            Get-Content msbuild.log -Tail 200
        } else {
            Write-Output "msbuild.log not found"
        }

    - name: Upload MSBuild Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: msbuild-log
        path: msbuild.log

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Compile Inno Setup Installer
      run: iscc AdrkhaTypograph.iss

    - name: Upload Unsigned Installer
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-installer
        path: Installer/AdrkhaTypograph_v1.0.0_Setup.exe

