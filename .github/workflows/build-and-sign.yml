name: Build and Sign Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore AdrkhaTypograph.csproj -PackagesDirectory packages

    - name: Import Certificate for Signing Manifests
      run: Import-PfxCertificate -FilePath 'AdrkhaTypograph_TemporaryKey.pfx' -CertStoreLocation Cert:\CurrentUser\My
      shell: powershell

    - name: Build Project (Release)
      run: msbuild AdrkhaTypograph.csproj /p:Configuration=Release /p:CI=true /t:Rebuild /fl

    - name: Update and Sign VSTO Manifests with Mage
      shell: powershell
      run: |
        Copy-Item -Path "Deployment\AdrkhaTypograph.dll.manifest" -Destination "bin\Release\AdrkhaTypograph.dll.manifest" -Force
        Copy-Item -Path "Deployment\AdrkhaTypograph.vsto" -Destination "bin\Release\AdrkhaTypograph.vsto" -Force
        $mage = Get-ChildItem -Path "C:\Program Files (x86)\Microsoft SDKs\Windows" -Filter "mage.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        Write-Output "Found mage.exe at: $mage"
        & $mage -Update "bin\Release\AdrkhaTypograph.dll.manifest" -FromDirectory "bin\Release"
        & $mage -Sign "bin\Release\AdrkhaTypograph.dll.manifest" -CertFile "AdrkhaTypograph_TemporaryKey.pfx"
        & $mage -Update "bin\Release\AdrkhaTypograph.vsto" -AppManifest "bin\Release\AdrkhaTypograph.dll.manifest"
        & $mage -Sign "bin\Release\AdrkhaTypograph.vsto" -CertFile "AdrkhaTypograph_TemporaryKey.pfx"

    - name: Print MSBuild Log on Failure
      if: failure()
      shell: powershell
      run: |
        if (Test-Path msbuild.log) {
            Get-Content msbuild.log -Tail 200
        } else {
            Write-Output "msbuild.log not found"
        }

    - name: Upload MSBuild Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: msbuild-log
        path: msbuild.log

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Compile Inno Setup Installer
      run: iscc AdrkhaTypograph.iss

    - name: Upload Unsigned Installer
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-installer
        path: Installer/AdrkhaTypograph_v1.0.0_Setup.exe

    - name: Automatic GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: Installer/AdrkhaTypograph_v1.0.0_Setup.exe
        name: AdrkhaTypograph ${{ github.ref_name }}
        body: |
          🎉 **AdrkhaTypograph ${{ github.ref_name }}**
          
          الإصدار الجديد لأداة AdrkhaTypograph لتنسيق الخطوط والنصوص العربية في PowerPoint.
          
          📦 **طريقة التثبيت:**
          1. قم بتحميل `AdrkhaTypograph_v1.0.0_Setup.exe` المرفق في الأسفل.
          2. شغل البرنامج واتبع خطوات التثبيت.
          3. افتح PowerPoint وستجد علامة التبويب الجديدة جاهزة للاستخدام.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


